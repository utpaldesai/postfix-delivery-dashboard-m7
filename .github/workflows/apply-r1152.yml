name: Apply R1.1.52 source

on:
  push:
    branches:
      - r1.1.52-clean-training-provenance-provider-aware-hop

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r1.1.52-clean-training-provenance-provider-aware-hop
          fetch-depth: 0
      - name: Apply R1.1.52 patch
        run: python tools/apply-r1152.py
      - name: Clean generated bytecode
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Validate R1.1.52
        run: |
          python tests/test-r1-1-52-training-provenance-provider-hop.py
          python tests/test-m7-ai-integration.py
      - name: Commit R1.1.52
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R1.1.52 clean training provenance and provider-aware hop intelligence"
          git push origin HEAD:r1.1.52-clean-training-provenance-provider-aware-hop
