name: Apply R1.1.53 source

on:
  push:
    branches:
      - r1.1.53-semantic-impersonation-action-intent

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: r1.1.53-semantic-impersonation-action-intent
          fetch-depth: 0

      - name: Apply R1.1.53 patch
        run: python tools/apply-r1153.py

      - name: Clean generated bytecode
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Validate R1.1.53
        env:
          PYTHONPATH: .
        run: |
          python tests/test-r1-1-53-semantic-impersonation-intent.py
          python tests/test-r1-1-52-training-provenance-provider-hop.py
          python tests/test-r1-1-50-admin-ground-truth-durable-save.py
          python tests/test-r1-1-51-quarantine-layout-alignment.py
          python tests/test-m7-ai-integration.py
          python stale-reference-audit.py

      - name: Remove one-shot staging helpers
        run: |
          rm -rf tools/r1153-patch
          rm -f tools/apply-r1153.py
          rm -f .github/workflows/apply-r1153.yml

      - name: Regenerate source checksums
        run: |
          find . -type f ! -path './.git/*' ! -name CHECKSUMS.sha256 -print0 | sort -z | xargs -0 sha256sum > CHECKSUMS.sha256
          python audit-build.py

      - name: Commit R1.1.53 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R1.1.53 semantic impersonation and action-intent intelligence"
          git push origin HEAD:r1.1.53-semantic-impersonation-action-intent
