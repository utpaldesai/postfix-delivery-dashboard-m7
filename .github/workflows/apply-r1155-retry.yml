name: Apply R1.1.55 source retry

on:
  push:
    branches:
      - r1.1.55-admin-review-queue-dedup

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: r1.1.55-admin-review-queue-dedup
          fetch-depth: 0

      - name: Apply R1.1.55 source
        run: |
          cat tools/r1155-patch/part-* > /tmp/r1155.patch
          python - <<'PY'
          from pathlib import Path
          patch = Path('/tmp/r1155.patch').read_text(encoding='utf-8')
          marker = '--- a/app/db.py\n'
          if marker not in patch:
              raise SystemExit('R1.1.55 core patch marker missing')
          Path('/tmp/r1155-core.patch').write_text(patch[patch.index(marker):], encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          title = '# Postfix Delivery Dashboard — R1.1.55 Admin Review Queue De-duplication + Semantic Intelligence'
          section = '''## R1.1.55 Admin Review Queue De-duplication
          - Keeps the Quarantine Admin Decision filter: All / Required / Completed.
          - Required is derived only from missing CURRENT authoritative Admin Ground Truth; historical/non-authoritative rows do not clear the queue.
          - Keeps the Review Pending Messages hyperlink as the single queue-level entry point.
          - Removes the duplicate per-record Admin Decision Required / Review Now control because the existing Intelligence button opens the same review screen.
          - Opening Intelligence never creates a training label; only explicit Admin Ground Truth save/acknowledgement is training-eligible.
          - No destructive database migration and no mail-flow change.'''
          if '## R1.1.55 Admin Review Queue De-duplication' not in text:
              readme.write_text(title + '\n\n' + section + '\n\n' + text, encoding='utf-8')
          PY
          git apply --check /tmp/r1155-core.patch
          git apply /tmp/r1155-core.patch

      - name: Validate R1.1.55
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile app/db.py app/main.py app/quarantine.py
          python tests/test-r1-1-54-admin-review-queue.py
          python tests/test-r1-1-53-semantic-impersonation-intent.py
          python tests/test-r1-1-52-training-provenance-provider-hop.py
          python tests/test-r1-1-50-admin-ground-truth-durable-save.py
          python tests/test-r1-1-51-quarantine-layout-alignment.py
          python tests/test-m7-ai-integration.py
          python scripts/verify_inline_js.py
          python stale-reference-audit.py

      - name: Remove one-shot staging helpers
        run: |
          rm -rf tools/r1155-patch
          rm -f .github/workflows/apply-r1155.yml
          rm -f .github/workflows/apply-r1155-retry.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Regenerate checksums and audit build
        run: |
          find . -type f ! -path './.git/*' ! -name CHECKSUMS.sha256 -print0 | sort -z | xargs -0 sha256sum > CHECKSUMS.sha256
          python audit-build.py

      - name: Commit R1.1.55 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R1.1.55 admin review queue de-duplication"
          git push origin HEAD:r1.1.55-admin-review-queue-dedup
